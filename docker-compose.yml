services:
  localstack:
    image: localstack/localstack:4.10
    container_name: mlops-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,iam,dynamodb,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "0"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"